
name: Java CI and Metrics

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  build-and-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check commit message format
        if: github.event_name == 'push'
        shell: bash
        run: |
          MESSAGE="${{ github.event.head_commit.message }}"
          if ! printf '%s\n' "$MESSAGE" | grep -Eq '^(feat|fix|docs|style|refactor|test|chore|ci|build|perf|revert)(\([a-zA-Z0-9._/-]+\))?!?: .{1,100}$'; then
            echo "::warning::Commit message does not follow Conventional Commits"
          fi

      - name: Run Checkstyle and save report
        continue-on-error: true
        run: ./mvnw --batch-mode checkstyle:checkstyle

      - name: Run tests
        continue-on-error: true
        run: ./mvnw --batch-mode test

      - name: Generate JaCoCo report
        if: always()
        continue-on-error: true
        run: ./mvnw --batch-mode jacoco:report

      - name: Collect metrics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p metrics
          python3 - <<'PY'
          import glob
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone

          os.makedirs("metrics", exist_ok=True)

          # 1. Checkstyle errors and warnings
          errors = warnings = 0
          for path in glob.glob("**/checkstyle-result.xml", recursive=True):
              try:
                  root = ET.parse(path).getroot()
                  for file_node in root.findall("file"):
                      for error in file_node.findall("error"):
                          severity = error.attrib.get("severity", "").lower()
                          if severity == "error":
                              errors += 1
                          elif severity == "warning":
                              warnings += 1
              except (ET.ParseError, OSError):
                  pass

          # 2. Test counts from Maven Surefire XML
          tests = failures = errors_test = skipped = 0
          for path in glob.glob("**/TEST-*.xml", recursive=True):
              if "/surefire-reports/" not in path.replace("\\", "/"):
                  continue
              try:
                  root = ET.parse(path).getroot()
                  tests += int(root.attrib.get("tests", 0))
                  failures += int(root.attrib.get("failures", 0))
                  errors_test += int(root.attrib.get("errors", 0))
                  skipped += int(root.attrib.get("skipped", 0))
              except (ET.ParseError, OSError, ValueError):
                  pass
          passed = max(0, tests - failures - errors_test - skipped)

          # 3. Coverage from JaCoCo CSV
          line_covered = line_missed = 0
          csv_files = glob.glob("**/jacoco.csv", recursive=True)
          for path in csv_files:
              try:
                  with open(path, encoding="utf-8") as file:
                      next(file, None)
                      for row in file:
                          parts = row.strip().split(",")
                          if len(parts) >= 12:
                              line_missed += int(parts[8])
                              line_covered += int(parts[9])
              except (OSError, ValueError):
                  pass
          total_lines = line_covered + line_missed
          coverage = 100 * line_covered / total_lines if total_lines else 0

          # 4. Commits in the last 7 days
          since = (datetime.now(timezone.utc) - timedelta(days=7)).isoformat()
          result = subprocess.run(
              ["git", "log", f"--since={since}", "--pretty=%H"],
              capture_output=True, text=True, check=False
          )
          commits = len([line for line in result.stdout.splitlines() if line.strip()])

          # 5. Successful workflow runs
          successful = total_runs = 0
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")
          if repo and token:
              api_url = f"https://api.github.com/repos/{repo}/actions/workflows/ci.yml/runs?per_page=100"
              try:
                  import json
                  import urllib.request
                  request = urllib.request.Request(
                      api_url,
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28"
                      }
                  )
                  with urllib.request.urlopen(request, timeout=15) as response:
                      data = json.load(response)
                  for run in data.get("workflow_runs", []):
                      conclusion = run.get("conclusion")
                      if conclusion in ("success", "failure", "cancelled", "timed_out", "action_required", "startup_failure"):
                          total_runs += 1
                          if conclusion == "success":
                              successful += 1
              except Exception as exc:
                  print(f"Could not read workflow history: {exc}")

          success_rate = 100 * successful / total_runs if total_runs else 0

          report = f"""# Project metrics

          Generated at: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}

          | Metric | Result |
          |---|---:|
          | Checkstyle errors | {errors} |
          | Checkstyle warnings | {warnings} |
          | Tests passed | {passed} |
          | Tests failed | {failures + errors_test} |
          | Tests skipped | {skipped} |
          | Line coverage | {coverage:.2f}% |
          | Commits in last 7 days | {commits} |
          | Successful workflow runs | {successful}/{total_runs} |
          | Workflow success rate | {success_rate:.2f}% |

          Note: if a report was not generated, its metric may show zero.
          """
          with open("metrics/metrics.md", "w", encoding="utf-8") as file:
              file.write(report)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
              file.write(report)

          print(report)
          PY

      - name: Upload reports and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-metrics-and-reports
          path: |
            metrics/
            **/target/site/jacoco/
            **/target/site/checkstyle.html
            **/target/checkstyle-result.xml
            **/target/surefire-reports/
          if-no-files-found: warn
